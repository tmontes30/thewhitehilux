<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<!-- COPIA GENERADA por disenos/configurador/copiar-al-panel.js: no editar aquí -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TWH · Configurador</title>
<style>
  :root { --bg: #EEEEEC; --card: #fff; --ink: #1B1C1A; --muted: #6B706C; --line: #E1E1DD; --accent: #E39B2D; --accent2: #E4572E; --blue: #2968C8; --red: #C8382A; --green: #0A8A4A; --r: 14px; --sh: 0 1px 3px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.05); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  header { background: var(--ink); color: #F2F0E8; padding: 10px 20px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 20; }
  header img { height: 32px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  header .sp { flex: 1; }
  .btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; background: #fff; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.accent { background: linear-gradient(135deg, #F2A541, #E4572E); color: #fff; }
  .btn.ghost { background: transparent; color: inherit; box-shadow: inset 0 0 0 1.5px currentColor; }
  .btn.small { padding: 7px 11px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 22px 20px 60px; }
  .hidden { display: none !important; }

  /* ---------- Inicio ---------- */
  .hero h2 { font-size: 26px; margin: 4px 0 4px; letter-spacing: -.01em; }
  .hero p { margin: 0 0 18px; color: var(--muted); }
  .types { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .type { background: var(--card); border: 0; border-radius: var(--r); box-shadow: var(--sh); padding: 0; cursor: pointer; text-align: left; overflow: hidden; transition: transform .12s, box-shadow .12s; }
  .type:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(0,0,0,.12); }
  .type .pic { aspect-ratio: 1; background: #E6E6E2; display: grid; place-items: center; overflow: hidden; }
  .type .pic img { width: 100%; height: 100%; object-fit: cover; }
  .type .txt { padding: 12px 14px 14px; }
  .type b { display: block; font-size: 18px; }
  .type span { color: var(--muted); font-size: 13.5px; }
  .tray { margin-top: 28px; background: var(--card); border-radius: var(--r); box-shadow: var(--sh); padding: 18px; }
  .tray-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .tray-head h3 { margin: 0; font-size: 17px; }
  .tray-head small { color: var(--muted); font-weight: 400; }
  .saved { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .sv { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
  .sv .thumb { aspect-ratio: 1; background: #E6E6E2; overflow: hidden; }
  .sv .meta { padding: 9px 10px 4px; }
  .sv .meta b { display: block; font-size: 13.5px; line-height: 1.25; }
  .sv .meta span { font-size: 12px; color: var(--muted); }
  .sv .acts { display: flex; gap: 4px; padding: 6px 8px 10px; margin-top: auto; }
  .sv .acts button { flex: 1; border: 0; background: #F2F1EC; border-radius: 8px; padding: 6px 0; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .sv .acts button.del { color: var(--red); }
  .empty { color: var(--muted); padding: 18px; text-align: center; border: 2px dashed var(--line); border-radius: 12px; }
  .done { margin-top: 14px; background: #EAF6EE; border-radius: 12px; padding: 14px 16px; font-size: 14px; }
  .done ol { margin: 6px 0 0; padding-left: 20px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #F2F1EC; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  /* ---------- Editor ---------- */
  .ed-bar { display: flex; align-items: center; gap: 10px; margin: -22px -20px 16px; padding: 12px 20px; flex-wrap: wrap; position: sticky; top: 52px; z-index: 15; background: rgba(238,238,236,.95); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  @media (max-width: 900px) { .ed-bar h2 { font-size: 18px; min-width: 0; } .ed-bar #back { display: none; } }
  .ed-bar h2 { margin: 0; font-size: 22px; flex: 1; min-width: 200px; }
  .ed { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 18px; align-items: start; }
  .step { background: var(--card); border-radius: var(--r); box-shadow: var(--sh); padding: 16px; margin-bottom: 12px; }
  .step-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .step-h .n { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 800; flex: none; }
  .step-h h3 { margin: 0; font-size: 15.5px; flex: 1; }
  .step-h .val { font-size: 12.5px; color: var(--muted); max-width: 55%; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step-h .val b { color: var(--ink); }
  .search { width: 100%; border: 1px solid #C9C9C4; border-radius: 10px; padding: 9px 12px; margin-bottom: 10px; background: #fff; }
  .picker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; padding: 2px; }
  .tile { border: 2px solid transparent; border-radius: 10px; background: #fff; cursor: pointer; padding: 0; overflow: hidden; display: flex; flex-direction: column; text-align: center; box-shadow: inset 0 0 0 1px var(--line); }
  .tile .lg { aspect-ratio: 1; background: #1B1C1A; display: grid; place-items: center; padding: 4px; }
  .tile .lg img { width: 100%; height: 100%; object-fit: contain; }
  .tile .lg.none { background: #F2F1EC; color: var(--muted); font-size: 22px; }
  .tile small { font-size: 10.5px; line-height: 1.2; padding: 4px 3px 5px; color: var(--muted); min-height: 30px; display: flex; align-items: center; justify-content: center; }
  .tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .tile[aria-pressed="true"] small { color: var(--ink); font-weight: 700; }
  .tile small .num { color: var(--accent2); margin-right: 2px; }
  .opt { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .opt > label { font-weight: 600; min-width: 74px; font-size: 14px; }
  .seg { display: inline-flex; background: #F2F1EC; border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  input[type=range] { flex: 1; min-width: 120px; }
  .colors { display: flex; gap: 10px; }
  .color { display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 12px; padding: 8px 14px 8px 10px; cursor: pointer; background: #fff; font-weight: 600; }
  .color i { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); }
  .color[aria-pressed="true"] { border-color: var(--accent); background: #FFF8EC; }
  .name-in { width: 100%; border: 1px solid #C9C9C4; border-radius: 10px; padding: 10px 12px; font-size: 15px; font-weight: 600; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
  .check input { width: 18px; height: 18px; }
  .preview { position: sticky; top: 70px; }
  .pv-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .pv-head b { font-size: 18px; }
  .pv-head span { color: var(--muted); }
  .views { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .view { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: var(--sh); }
  .view .cap { padding: 7px 12px; font-size: 12.5px; color: var(--muted); }
  .stage { position: relative; width: 100%; }
  .stage > img.base { width: 100%; display: block; }
  .stage .lg { position: absolute; pointer-events: none; }
  .stage .patch { position: absolute; background: #E9E4D6; box-shadow: 0 1px 3px rgba(0,0,0,.4); outline: 1px dashed rgba(60,55,45,.4); outline-offset: -3px; }
  .et-stage { aspect-ratio: 3 / 4; display: grid; place-items: center; padding: 18px; }
  .et-stage svg { width: 78%; height: auto; }
  .sticker-bg { aspect-ratio: 1; background: repeating-linear-gradient(45deg, #DADAD5 0 12px, #E3E3DF 12px 24px); display: grid; place-items: center; }
  .sticker { width: 64%; aspect-ratio: 1; background: #fff; border-radius: 18%; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.22); padding: 7%; }
  .sticker img { width: 100%; height: 100%; object-fit: contain; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px; font-weight: 600; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
  .toast.err { background: var(--red); }

  @media (max-width: 900px) {
    .types { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ed { grid-template-columns: 1fr; }
    .preview { position: static; order: -1; }
    .views { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .picker { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    header .help { display: none; }
  }
</style>
</head>
<body>
<header>
  <img src="../../assets/logos/logo-oficial.svg" alt="The White Hilux">
  <h1>Configurador</h1>
  <span class="sp"></span>
  <span class="help" style="font-size:12.5px;color:rgba(242,240,232,.7)">Crea productos nuevos. No modifica nada de lo que ya está en la tienda.</span>
</header>

<!-- ============ INICIO ============ -->
<main class="wrap" id="v-inicio">
  <section class="hero">
    <h2>¿Qué quieres crear?</h2>
    <p>Elige el tipo de producto. Lo armas, lo guardas en tu sesión y puedes crear todos los que quieras antes de exportar.</p>
  </section>
  <div class="types" id="types"></div>

  <section class="tray">
    <div class="tray-head">
      <h3>Tu sesión <small id="tray-count"></small></h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn small ghost" id="clear" style="color:var(--red)">Vaciar sesión</button>
        <button class="btn accent" id="export">Exportar productos nuevos</button>
      </div>
    </div>
    <div id="saved"></div>
    <div class="done hidden" id="done"></div>
  </section>
</main>

<!-- ============ EDITOR ============ -->
<main class="wrap hidden" id="v-editor">
  <div class="ed-bar">
    <button class="btn small ghost" id="back">← Volver</button>
    <h2 id="ed-title"></h2>
    <button class="btn ghost" id="cancel">Cancelar</button>
    <button class="btn primary" id="save">Guardar</button>
  </div>
  <div class="ed">
    <div id="steps"></div>
    <aside class="preview">
      <div class="pv-head"><div><b id="pv-name"></b> <span id="pv-price"></span></div><div class="seg" id="pv-color"></div></div>
      <div class="views" id="views"></div>
    </aside>
  </div>
</main>

<div class="toast hidden" id="toast"></div>

<script src="posiciones.js?v=mwv3zuwl"></script>
<script src="datos.js?v=mwv3zuwl"></script>
<script src="etiqueta.js?v=mwv3zuwl"></script>
<script>
(function () {
  // Configurador de productos NUEVOS. Parte vacío cada vez; lo guardado queda en la sesión de esta pestaña
  // (sessionStorage) y se exporta como "agregar": aplicar.js lo suma a la tienda sin tocar lo que ya existe.
  var P = TWHPos, CFG = TWH_CFG, E = window.TWHEtiqueta, KEY = 'twh-cfg-sesion';
  var LOGOS = {}; CFG.logos.forEach(function (l) { LOGOS[l.id] = l; });
  var LOGO_DIR = '../../assets/logos/', BASE_DIR = 'bases/';
  var PRICES = { polera: P.PRICES.polera, poleron: P.PRICES.poleron, jockey: P.PRICES.jockey, sticker: 2990 };
  var TIPOS = { polera: 'Polera', poleron: 'Polerón', jockey: 'Jockey', sticker: 'Sticker' };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var clp = function (n) { return '$' + Number(n).toLocaleString('es-CL'); };

  var sesion = [];
  try { sesion = JSON.parse(sessionStorage.getItem(KEY) || '[]') || []; } catch (e) { sesion = []; }
  function persist() { try { sessionStorage.setItem(KEY, JSON.stringify(sesion)); } catch (e) {} }
  var draft = null, editIdx = null, original = '', color = 'negro', etTalla = 'M', search = {};

  function toast(t, err) { var el = $('toast'); el.textContent = t; el.className = 'toast' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(function () { el.className = 'toast hidden'; }, 2600); }
  function nameOf(id) { return id && LOGOS[id] ? LOGOS[id].name : ''; }
  function cap(s) { return s.replace(/(^|\s)(\S)/g, function (m, a, b) { return a + b.toUpperCase(); }); }
  function autoName(d) {
    if (d.tipo === 'sticker') return d.logo ? 'Sticker ' + nameOf(d.logo) : 'Sticker';
    if (d.tipo === 'jockey') return d.jockey.logo ? 'Jockey 5 Paneles ' + nameOf(d.jockey.logo) + (d.jockey.estilo === 'parche' ? ' Parche Tejido' : ' Bordado') : 'Jockey 5 Paneles';
    var main = cap(d.espalda ? nameOf(d.espalda.logo) : nameOf(d.frente && d.frente.logo));
    if (d.tipo === 'poleron') return 'Polerón Canguro ' + main;
    return ((d.espalda ? 'Polera ' : 'Polera Básica ') + main).trim();
  }
  function blank(tipo) {
    var d = { id: tipo + '-' + Date.now().toString(36), tipo: tipo };
    if (tipo === 'sticker') d.logo = null;
    else if (tipo === 'jockey') { d.colores = ['negro']; d.jockey = { logo: null, estilo: 'parche', tam: 'm' }; }
    else { d.colores = P.COLORS[tipo].slice(); d.frente = null; d.espalda = null; d.etiqueta = true; }
    d.nombre = autoName(d); d.auto = true;
    return d;
  }
  function falta(d) {
    if (d.tipo === 'sticker') return d.logo ? '' : 'Elige el logo del sticker.';
    if (d.tipo === 'jockey') return d.jockey.logo ? '' : 'Elige el logo del jockey.';
    if (!d.frente && !d.espalda) return 'Elige al menos un logo (frente o espalda).';
    if (!d.nombre.trim()) return 'Ponle un nombre.';
    return '';
  }

  // ---------- Dibujo ----------
  function stage(d, viewKey) {
    var V = P.VIEWS[viewKey];
    var html = '<div class="stage"><img class="base" src="' + BASE_DIR + V.img + '" alt="">';
    P.placementsFor(d, viewKey).forEach(function (p) {
      var m = LOGOS[p.logo]; if (!m) return;
      var r = P.rect(m, viewKey, p);
      if (p.parche) {
        var pad = r.cWidth * 0.2;
        html += '<div class="patch" style="left:' + (r.cLeft - pad) + '%;top:' + (r.cTop - pad * V.size[0] / V.size[1]) + '%;width:' + (r.cWidth + 2 * pad) + '%;height:' + (r.cHeight + 2 * pad * V.size[0] / V.size[1]) + '%"></div>';
      }
      html += '<img class="lg" src="' + LOGO_DIR + p.logo + (p.claro ? '-claro' : '') + '.svg" style="left:' + r.left + '%;top:' + r.top + '%;width:' + r.width + '%;height:' + r.height + '%;opacity:.93">';
    });
    return html + '</div>';
  }
  function stickerHtml(logo) { return '<div class="sticker-bg"><div class="sticker">' + (logo ? '<img src="' + LOGO_DIR + logo + '-claro.svg" alt="">' : '') + '</div></div>'; }
  function thumb(d) {
    if (d.tipo === 'sticker') return stickerHtml(d.logo);
    var c = (d.colores && d.colores[0]) || 'negro';
    return stage(d, P.viewsFor(d, c)[0]);
  }

  // ---------- Inicio ----------
  function renderInicio() {
    $('v-inicio').classList.remove('hidden'); $('v-editor').classList.add('hidden');
    var pics = { polera: '<img src="' + BASE_DIR + 'polera-negro-frente.png" alt="">', poleron: '<img src="' + BASE_DIR + 'poleron-negro-frente.png" alt="">', jockey: '<img src="' + BASE_DIR + 'jockey-negro.png" alt="">', sticker: stickerHtml('race-dept-ops') };
    var sub = { polera: 'Negro y/o blanco · logo pecho y espalda', poleron: 'Negro · logo pecho y espalda', jockey: '5 paneles · bordado o parche', sticker: 'Vinilo 10 cm · un logo' };
    $('types').innerHTML = ['polera', 'poleron', 'jockey', 'sticker'].map(function (t) {
      return '<button class="type" data-t="' + t + '"><div class="pic">' + pics[t] + '</div><div class="txt"><b>' + TIPOS[t] + '</b><span>' + clp(PRICES[t]) + ' · ' + sub[t] + '</span></div></button>';
    }).join('');
    $('tray-count').textContent = sesion.length ? '(' + sesion.length + (sesion.length === 1 ? ' producto' : ' productos') + ')' : '';
    $('saved').innerHTML = sesion.length ? '<div class="saved">' + sesion.map(function (d, i) {
      return '<div class="sv"><div class="thumb">' + thumb(d) + '</div><div class="meta"><span class="pill">' + TIPOS[d.tipo] + '</span><b>' + esc(d.nombre) + '</b><span>' + clp(PRICES[d.tipo]) + (d.colores && d.tipo === 'polera' ? ' · ' + d.colores.join(' y ') : '') + '</span></div>' +
        '<div class="acts"><button data-act="edit" data-i="' + i + '">Editar</button><button data-act="dup" data-i="' + i + '">Duplicar</button><button class="del" data-act="del" data-i="' + i + '">Borrar</button></div></div>';
    }).join('') + '</div>'
      : '<div class="empty">Todavía no has guardado nada en esta sesión. Elige arriba qué quieres crear.</div>';
    $('export').disabled = !sesion.length;
    $('clear').classList.toggle('hidden', !sesion.length);
    window.scrollTo(0, 0);
  }
  $('types').onclick = function (e) { var b = e.target.closest('.type'); if (b) abrir(blank(b.getAttribute('data-t')), null); };
  $('saved').onclick = function (e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var i = +b.getAttribute('data-i'), act = b.getAttribute('data-act');
    if (act === 'edit') abrir(JSON.parse(JSON.stringify(sesion[i])), i);
    if (act === 'dup') { var c = JSON.parse(JSON.stringify(sesion[i])); c.id = c.tipo + '-' + Date.now().toString(36); c.nombre += ' (copia)'; c.auto = false; sesion.splice(i + 1, 0, c); persist(); renderInicio(); toast('Duplicado'); }
    if (act === 'del' && confirm('¿Borrar "' + sesion[i].nombre + '" de tu sesión?')) { sesion.splice(i, 1); persist(); renderInicio(); toast('Borrado'); }
  };
  $('clear').onclick = function () { if (confirm('¿Vaciar la sesión? Se borran los ' + sesion.length + ' productos que creaste (los de la tienda no se tocan).')) { sesion = []; persist(); $('done').classList.add('hidden'); renderInicio(); } };
  $('export').onclick = function () {
    if (!sesion.length) return;
    var data = { modo: 'agregar', generado: new Date().toISOString(), productos: sesion.map(function (d) { var c = JSON.parse(JSON.stringify(d)); delete c.auto; return c; }) };
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
    a.download = 'twh-coleccion-nuevos-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    $('done').classList.remove('hidden');
    $('done').innerHTML = '<b>✓ Exportado: ' + sesion.length + (sesion.length === 1 ? ' producto nuevo' : ' productos nuevos') + '</b> (quedó en Descargas).' +
      '<ol><li>En el computador, haz doble clic en <b>APLICAR-COLECCION.bat</b> (carpeta disenos/configurador).</li>' +
      '<li>Genera las fotos, <b>agrega</b> estos productos a la tienda como <b>Próximamente</b> y publica. Lo que ya estaba no se toca.</li>' +
      '<li>En el panel → Productos, cárgales stock y pásalos a <b>Disponible</b> cuando quieras venderlos.</li></ol>';
  };

  // ---------- Editor ----------
  function abrir(d, idx) {
    draft = d; editIdx = idx; original = JSON.stringify(d); search = {};
    color = (d.colores && d.colores[0]) || 'negro';
    $('v-inicio').classList.add('hidden'); $('v-editor').classList.remove('hidden');
    renderEditor(); window.scrollTo(0, 0);
  }
  function cerrar() { draft = null; renderInicio(); }
  function salir() { if (JSON.stringify(draft) !== original && !confirm('¿Salir sin guardar? Se pierden los cambios de este producto.')) return; cerrar(); }
  $('back').onclick = salir; $('cancel').onclick = salir;
  $('save').onclick = function () {
    var f = falta(draft); if (f) return toast(f, true);
    if (editIdx == null) sesion.push(draft); else sesion[editIdx] = draft;
    persist(); var n = draft.nombre; cerrar(); toast('Guardado en tu sesión: ' + n);
  };

  function upd(fn) { fn(draft); if (draft.auto) draft.nombre = autoName(draft); renderEditor(); }
  function seg(id, opts, val) { return '<div class="seg" data-seg="' + id + '">' + opts.map(function (o) { return '<button data-v="' + o[0] + '" aria-pressed="' + (o[0] === val) + '">' + o[1] + '</button>'; }).join('') + '</div>'; }
  function picker(key, selected, allowNone) {
    var q = (search[key] || '').toLowerCase();
    var list = CFG.logos.filter(function (l) { return !q || l.name.toLowerCase().indexOf(q) >= 0 || String(l.num) === q; });
    return '<input class="search" data-search="' + key + '" placeholder="Buscar por nombre o número (' + CFG.logos.length + ' logos)…" value="' + esc(search[key] || '') + '">' +
      '<div class="picker" data-pick="' + key + '">' +
      (allowNone ? '<button class="tile" data-id="" aria-pressed="' + (!selected) + '"><div class="lg none">∅</div><small>Sin logo</small></button>' : '') +
      list.map(function (l) { return '<button class="tile" data-id="' + l.id + '" aria-pressed="' + (l.id === selected) + '" title="' + esc(l.name) + '"><div class="lg"><img src="' + LOGO_DIR + l.id + '.svg" alt="" loading="lazy"></div><small>' + (l.num ? '<b class="num">' + l.num + '.</b> ' : '') + esc(l.name) + '</small></button>'; }).join('') +
      (list.length ? '' : '<p class="hint">Ningún logo con ese nombre.</p>') + '</div>';
  }
  function step(n, title, val, body) { return '<section class="step"><div class="step-h"><span class="n">' + n + '</span><h3>' + title + '</h3><span class="val">' + val + '</span></div>' + body + '</section>'; }
  var TAM = [['s', 'Chico'], ['m', 'Mediano'], ['l', 'Grande']];

  function renderEditor() {
    var d = draft, n = 1, h = '';
    $('ed-title').textContent = (editIdx == null ? (d.tipo === 'polera' ? 'Nueva ' : 'Nuevo ') : 'Editar ') + TIPOS[d.tipo].toLowerCase();
    if (d.tipo === 'polera' || d.tipo === 'poleron') {
      h += step(n++, 'Logo del frente', d.frente ? '<b>' + esc(nameOf(d.frente.logo)) + '</b>' : 'sin logo',
        picker('frente', d.frente && d.frente.logo, true) +
        (d.frente ? '<div class="opt"><label>Posición</label>' + seg('f-pos', [['pecho', 'Pecho (corazón)'], ['centro', 'Centro']], d.frente.pos) + '</div>' +
          '<div class="opt"><label>Tamaño</label>' + seg('f-tam', TAM, d.frente.tam) + '</div>' : ''));
      h += step(n++, 'Logo de la espalda', d.espalda ? '<b>' + esc(nameOf(d.espalda.logo)) + '</b>' : 'espalda lisa',
        picker('espalda', d.espalda && d.espalda.logo, true) +
        (d.espalda ? '<div class="opt"><label>Tamaño</label>' + seg('e-tam', TAM, d.espalda.tam) + '</div>' +
          '<div class="opt"><label>Altura</label><input type="range" id="e-alto" min="-6" max="12" step="1" value="' + (d.espalda.alto || 0) + '"><span class="hint" style="margin:0">' + (d.espalda.alto > 0 ? 'más abajo' : d.espalda.alto < 0 ? 'más arriba' : 'normal') + '</span></div>' : ''));
      if (d.tipo === 'polera') h += step(n++, 'Colores', '<b>' + d.colores.join(' y ') + '</b>',
        '<div class="colors">' + [['negro', 'Negro', '#1B1C1A'], ['blanco', 'Blanco', '#F4F3EF']].map(function (c) { return '<button class="color" data-color="' + c[0] + '" aria-pressed="' + (d.colores.indexOf(c[0]) >= 0) + '"><i style="background:' + c[2] + '"></i>' + c[1] + '</button>'; }).join('') + '</div><p class="hint">Puedes ofrecerla en uno o en los dos colores.</p>');
      h += step(n++, 'Etiqueta en el cuello', d.etiqueta !== false ? '<b>sí</b>' : 'no',
        '<label class="check"><input type="checkbox" id="et-on"' + (d.etiqueta !== false ? ' checked' : '') + '> Estampar etiqueta (logo + talla)</label><p class="hint">Se elige sola según el color: negra → etiqueta clara · blanca → etiqueta oscura.</p>');
    } else if (d.tipo === 'jockey') {
      h += step(n++, 'Logo del jockey', d.jockey.logo ? '<b>' + esc(nameOf(d.jockey.logo)) + '</b>' : 'elige uno', picker('jockey', d.jockey.logo, false));
      h += step(n++, 'Estilo y tamaño', '<b>' + (d.jockey.estilo === 'parche' ? 'Parche tejido' : 'Bordado') + '</b>',
        '<div class="opt" style="margin-top:0"><label>Estilo</label>' + seg('j-est', [['parche', 'Parche tejido'], ['bordado', 'Bordado']], d.jockey.estilo) + '</div>' +
        '<div class="opt"><label>Tamaño</label>' + seg('j-tam', TAM, d.jockey.tam) + '</div>');
    } else {
      h += step(n++, 'Logo del sticker', d.logo ? '<b>' + esc(nameOf(d.logo)) + '</b>' : 'elige uno', picker('sticker', d.logo, false) + '<p class="hint">Se suma como diseño nuevo del sticker (el cliente lo elige en la ficha del sticker).</p>');
    }
    h += step(n++, 'Nombre', '', '<input class="name-in" id="nombre" value="' + esc(d.nombre) + '" maxlength="80"><p class="hint">' + (d.auto ? 'Se arma solo con los logos. Puedes cambiarlo.' : 'Nombre personalizado.') + '</p>');
    $('steps').innerHTML = h;
    renderPreview();
  }
  function renderPreview() {
    var d = draft;
    $('pv-name').textContent = d.nombre;
    $('pv-price').textContent = clp(PRICES[d.tipo]);
    if (d.tipo === 'sticker') { $('pv-color').innerHTML = ''; $('views').innerHTML = '<div class="view">' + stickerHtml(d.logo) + '<div class="cap">Sticker vinilo 10 cm</div></div>'; return; }
    if (d.colores.indexOf(color) < 0) color = d.colores[0];
    $('pv-color').innerHTML = d.colores.length > 1 ? d.colores.map(function (c) { return '<button data-v="' + c + '" aria-pressed="' + (c === color) + '">' + (c === 'negro' ? 'Negro' : 'Blanco') + '</button>'; }).join('') : '';
    var LBL = { frente: 'Frente', 'frente-2': 'Frente (otra pose)', espalda: 'Espalda' };
    $('views').innerHTML = P.viewsFor(d, color).map(function (v) {
      var k = v.replace(/^(polera|poleron)-(negro|blanco)-/, '').replace('jockey-negro', 'jockey');
      return '<div class="view">' + stage(d, v) + '<div class="cap">' + (LBL[k] || 'Jockey') + '</div></div>';
    }).join('') + (d.tipo !== 'jockey' && d.etiqueta !== false && E ? (function () {
      var ver = E.versionPara(color);
      return '<div class="view"><div class="et-stage" style="background:' + E.VERSIONES[ver].fondo + '">' + E.svg(etTalla, ver, { width: '100%', height: 'auto' }) + '</div><div class="cap">Etiqueta cuello · talla ' + etTalla + '</div></div>';
    })() : '');
  }

  // eventos del editor (delegados)
  $('steps').addEventListener('click', function (e) {
    var t = e.target.closest('.tile');
    if (t) {
      var key = t.parentNode.getAttribute('data-pick'), id = t.getAttribute('data-id') || null;
      upd(function (x) {
        if (key === 'frente') x.frente = id ? Object.assign({ pos: 'pecho', tam: 'm' }, x.frente || {}, { logo: id }) : null;
        if (key === 'espalda') x.espalda = id ? Object.assign({ tam: 'm', alto: 0 }, x.espalda || {}, { logo: id }) : null;
        if (key === 'jockey') x.jockey.logo = id;
        if (key === 'sticker') x.logo = id;
      });
      return;
    }
    var b = e.target.closest('.seg button');
    if (b) {
      var s = b.parentNode.getAttribute('data-seg'), v = b.getAttribute('data-v');
      upd(function (x) {
        if (s === 'f-pos') x.frente.pos = v; if (s === 'f-tam') x.frente.tam = v; if (s === 'e-tam') x.espalda.tam = v;
        if (s === 'j-est') x.jockey.estilo = v; if (s === 'j-tam') x.jockey.tam = v;
      });
      return;
    }
    var c = e.target.closest('.color');
    if (c) {
      var col = c.getAttribute('data-color');
      upd(function (x) {
        var on = x.colores.indexOf(col) >= 0;
        if (on && x.colores.length === 1) return toast('Deja al menos un color', true);
        x.colores = on ? x.colores.filter(function (y) { return y !== col; }) : ['negro', 'blanco'].filter(function (y) { return y === col || x.colores.indexOf(y) >= 0; });
      });
    }
  });
  $('steps').addEventListener('input', function (e) {
    if (e.target.getAttribute('data-search')) {
      var key = e.target.getAttribute('data-search'); search[key] = e.target.value;
      var pos = e.target.selectionStart; renderEditor();
      var inp = document.querySelector('[data-search="' + key + '"]'); inp.focus(); inp.setSelectionRange(pos, pos);
    }
    if (e.target.id === 'nombre') { draft.nombre = e.target.value; draft.auto = false; $('pv-name').textContent = draft.nombre; }
    if (e.target.id === 'e-alto') { draft.espalda.alto = +e.target.value; renderPreview(); e.target.nextSibling.textContent = draft.espalda.alto > 0 ? 'más abajo' : draft.espalda.alto < 0 ? 'más arriba' : 'normal'; }
  });
  $('steps').addEventListener('change', function (e) {
    if (e.target.id === 'et-on') upd(function (x) { x.etiqueta = e.target.checked; });
    if (e.target.id === 'nombre' && !draft.nombre.trim()) { draft.auto = true; upd(function () {}); }
  });
  $('pv-color').onclick = function (e) { var b = e.target.closest('button'); if (b) { color = b.getAttribute('data-v'); renderPreview(); } };

  renderInicio();
})();
</script>
</body>
</html>
