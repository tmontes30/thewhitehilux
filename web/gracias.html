<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/logos/favicon-twh.svg">
<title>¡Gracias! · The White Hilux</title>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap result">
  <p class="eyebrow">Pago aprobado</p>
  <h1>¡Gracias por tu compra!</h1>
  <p>Tu pedido <code id="order">—</code> quedó confirmado. Guarda ese número: con él y tu correo puedes ver en qué va tu pedido cuando quieras.</p>
  <p>Mientras tanto, sube una foto con tu merch y etiqueta a <b>@the.whitehilux</b>.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn primary" id="track" href="seguimiento.html" style="width:auto">Sigue tu pedido</a><a class="btn secondary" href="index.html" style="width:auto">Volver a la tienda</a></div>
</main>
<div id="site-footer"></div>
<script src="data/catalog.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/mockups.js"></script>
<script src="assets/js/store.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var ref = q.get('external_reference');
  var last = null; try { last = localStorage.getItem('twh-last-order'); } catch (e) {}
  var id = ref || last;
  document.getElementById('order').textContent = id || '—';
  if (id) document.getElementById('track').href = 'seguimiento.html?pedido=' + encodeURIComponent(id);
  var status = q.get('collection_status') || q.get('status');
  if (!status || status === 'approved') {
    TWH.Cart.clear();
    TWH.paso('compra');
    // se guarda el número para que "Sigue tu pedido" lo rellene solo
    if (id) try { localStorage.setItem('twh-last-order', id); } catch (e) {}
  }
})();
</script>
</body>
</html>
