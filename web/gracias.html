<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Gracias! · The White Hilux</title>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap result">
  <p class="eyebrow">Pago aprobado</p>
  <h1>¡Gracias por tu compra!</h1>
  <p>Tu pedido <code id="order">—</code> quedó confirmado. Te llegará un correo con el detalle y te avisaremos cuando salga el despacho.</p>
  <p>Mientras tanto, sube una foto con tu merch y etiqueta a <b>@the.whitehilux</b>.</p>
  <div><a class="btn primary" href="index.html">Volver a la tienda</a></div>
</main>
<div id="site-footer"></div>
<script src="data/catalog.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/mockups.js"></script>
<script src="assets/js/store.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var ref = q.get('external_reference');
  var last = null; try { last = localStorage.getItem('twh-last-order'); } catch (e) {}
  document.getElementById('order').textContent = ref || last || '—';
  var status = q.get('collection_status') || q.get('status');
  if (!status || status === 'approved') {
    TWH.Cart.clear();
    try { localStorage.removeItem('twh-last-order'); } catch (e) {}
  }
})();
</script>
</body>
</html>
