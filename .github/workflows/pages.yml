# Publica la tienda (carpeta web/) en GitHub Pages en cada push a main.
name: Publicar tienda

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: cd web && npm test
      - name: Armar sitio (sin pruebas ni código de servidor)
        run: |
          mkdir _site
          cp -r web/. _site/
          rm -rf _site/lib _site/tests _site/package.json _site/package-lock.json _site/node_modules _site/.gitignore
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
