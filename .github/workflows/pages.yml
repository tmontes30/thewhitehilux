# Publica la tienda (carpeta web/) en GitHub Pages en cada push a main.
name: Publicar tienda

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: cd web && npm test
      - name: Armar sitio (sin pruebas ni código de servidor)
        run: |
          mkdir _site
          cp -r web/. _site/
          rm -rf _site/lib _site/tests _site/package.json _site/package-lock.json _site/node_modules _site/.gitignore
          touch _site/.nojekyll
      - name: Versión en los archivos (el navegador baja siempre los .js/.css nuevos)
        run: |
          V=${GITHUB_SHA::8}
          for f in _site/*.html _site/admin/*.html _site/admin/configurador/*.html; do
            if [ -f "$f" ]; then sed -E -i "s#((src|href)=\"[^\":?]+\.(js|css))\"#\1?v=$V\"#g" "$f"; fi
          done
          echo "Archivos versionados en el inicio: $(grep -o "?v=$V" _site/index.html | wc -l)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # A veces GitHub no encuentra el archivo recién subido ("No artifacts named github-pages"): se reintenta solo
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Esperar antes de reintentar
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
